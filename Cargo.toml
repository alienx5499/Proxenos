[workspace]
resolver = "3"
members = ["crates/domain", "crates/app", "crates/switch_client", "crates/notary", "crates/bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
proxenos-domain = { path = "crates/domain" }
proxenos-app = { path = "crates/app" }
proxenos-switch-client = { path = "crates/switch_client" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
proptest = "1.12.0"
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "stream", "multipart"] }
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros"] }
futures-util = "0.3.34"
uuid = { version = "1.28.0", features = ["v4"] }
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
sha2 = "0.11.1"
hmac = "0.13.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
aes-gcm = "0.11.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"
